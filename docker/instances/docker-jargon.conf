# Docker starts the Jargon containers when it starts. `jargon-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/jargon.conf.
[Unit]
# No container starts without its firewall: when jargon-firewall fails, Docker does not start.
Requires=jargon-firewall.service
After=jargon-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
