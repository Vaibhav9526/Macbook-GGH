# The container logs of the Jargon instances. `jargon-instance setup` installs it as
# /etc/rsyslog.d/30-jargon-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. jargon-logrotate keeps the files for 30 days.
template(name="JargonDockerFile" type="string" string="/var/log/jargon/%programname%.log")
template(name="JargonDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="jargon-docker") {
  # The tag is the container name, which jargon-instance gives.
  if $programname startswith "jargon-" then {
    # setup makes /var/log/jargon for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="JargonDockerFile" template="JargonDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/jargon-docker/dev/log" ruleset="jargon-docker" createPath="off")
